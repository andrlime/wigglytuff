# config.yaml is sym-linked across all children directories
interval: 150
rabbitmq:
  hostname: rabbitmq
  port: 5672
  queue_name: job-message-queue
  debug_mode: false
postgres:
  hostname: postgres
  port: 5432
  ssl_mode: disable
rpc:
  interval: 900
  hostname: rpc-cache
  port: 50051
  notifier-hostname: bot-notifier
